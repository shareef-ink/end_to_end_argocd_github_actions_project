name: CI-CD Pipeline with ArgoCD

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      IMAGE_NAME: skshareef/k8s

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Setup Java
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # Build Maven Project
      - name: Build with Maven
        run: mvn clean package

      # Docker Login
      - name: Login to DockerHub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      # Docker Buildx
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Build and Push Docker Image
      - name: Build and Push Docker Image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE_NAME }}:${{ github.run_number }}

      # Update Deployment Manifest
      - name: Update Deployment Manifest
        run: |
          sed -i "s|image: .*|image: ${{ env.IMAGE_NAME }}:${{ github.run_number }}|g" deploymentfiles/deployment.yml

          echo "Updated deployment.yml"
          cat deploymentfiles/deployment.yml

      # Commit only deployment.yml
      - name: Commit Deployment Manifest
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Update deployment image to version ${{ github.run_number }}"
          branch: main
          file_pattern: deploymentfiles/deployment.yml

  deploy:
    runs-on: ubuntu-latest
    needs: build

    steps:
      # Checkout Repository
      - name: Checkout Code
        uses: actions/checkout@v4

      # Install ArgoCD CLI
      - name: Install ArgoCD CLI
        run: |
          curl -sSL -o argocd https://github.com/argoproj/argo-cd/releases/latest/download/argocd-linux-amd64
          chmod +x argocd
          sudo mv argocd /usr/local/bin/
          argocd version --client

      # Login to ArgoCD
      - name: Login to ArgoCD
        run: |
          argocd login ${{ secrets.ARGOCD_SERVER }} \
            --username admin \
            --password ${{ secrets.ARGOCD_PASSWORD }} \
            --insecure \
            --grpc-web

      # Sync Application
      - name: Sync ArgoCD Application
        run: |
          argocd app sync prodapp --grpc-web

      # Wait for Healthy Status
      - name: Wait for Application Health
        run: |
          argocd app wait prodapp \
            --health \
            --sync \
            --grpc-web \
            --timeout 300
